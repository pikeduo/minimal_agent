[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-agent"
version = "0.1.0"
description = "Minimal Agent：从零实现的轻量 Web Agent。"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "jsonschema>=4.23,<5.0",
    "openai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
minimal-agent = "minimal_agent.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: 需要显式启用并配置真实模型服务的冒烟测试",
]

[tool.setuptools.packages.find]
include = ["minimal_agent*"]
