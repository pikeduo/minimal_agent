<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Minimal Agent{% endblock %}</title>
    <link rel="stylesheet" href="/static/site.css?v=20260804-2">
    <script src="/static/site.js" defer></script>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  </head>
  <body{% if current_user %} data-current-user-id="{{ current_user.user_id }}"{% endif %}>
    <main class="page-shell">
      <nav class="top-nav" aria-label="主导航">
        <a class="brand" href="/">Minimal Agent</a>
        <div class="nav-links">
          {% if current_user %}
            <span class="current-user">{{ current_user.username }}</span>
            <a href="/">会话</a>
            <a href="/settings">设置</a>
            <form action="/logout" method="post">
              <button class="logout-button" type="submit">退出登录</button>
            </form>
          {% else %}
            <a href="/login">登录</a>
            <a href="/register">注册</a>
          {% endif %}
        </div>
      </nav>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
