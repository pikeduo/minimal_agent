{% extends "base.html" %}

{% block title %}{{ session.title }}｜Minimal Agent{% endblock %}

{% block content %}
  <header class="page-header chat-page-header">
    <form
      action="/sessions/{{ session.session_id }}/leave"
      method="post"
      class="back-form"
      data-empty-session-leave-url="/sessions/{{ session.session_id }}/leave"
    >
      <button class="back-link" type="submit">← 返回会话列表</button>
    </form>
    <p class="eyebrow">对话空间</p>
    <h1>{{ session.title }}</h1>
    <p>可使用受控工具，也可在设置中管理浏览器密钥。</p>
  </header>

  {% include "fragments/chat_panel.html" %}

  <form
    class="panel composer-panel"
    action="/sessions/{{ session.session_id }}/messages"
    method="post"
    hx-post="/sessions/{{ session.session_id }}/messages"
    hx-target="#chat-panel"
    hx-swap="outerHTML"
  >
    <label for="message-content">消息</label>
    <textarea id="message-content" name="content" rows="4" maxlength="4000" required></textarea>
    <div class="composer-footer">
      <span>
        <span>Enter 换行，点击发送开始运行</span>
        <small id="browser-key-chat-status" class="browser-key-status" aria-live="polite">正在检测浏览器密钥状态。</small>
      </span>
      <button type="submit">发送消息</button>
    </div>
  </form>

  {% include "fragments/todos.html" %}
{% endblock %}
