{% extends "base.html" %}

{% block title %}{{ session.title }}｜Minimal Agent{% endblock %}

{% block content %}
  <header>
    <p><a href="/">← 返回会话列表</a></p>
    <h1>{{ session.title }}</h1>
    <p>会话 ID：<code>{{ session.session_id }}</code></p>
  </header>

  {% include "fragments/chat_panel.html" %}

  <form
    class="panel"
    action="/sessions/{{ session.session_id }}/messages"
    method="post"
    hx-post="/sessions/{{ session.session_id }}/messages"
    hx-target="#chat-panel"
    hx-swap="outerHTML"
  >
    <label for="message-content">消息</label>
    <textarea id="message-content" name="content" rows="4" maxlength="4000" required></textarea>
    <button type="submit">发送</button>
  </form>

  {% include "fragments/todos.html" %}
{% endblock %}
